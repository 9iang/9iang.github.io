<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="个人介绍、游戏体验拆解和设计作品集。">
  <meta name="theme-color" content="#f3f5fa">
  <title>个人简历</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./resume.config.js" defer></script>
  <script src="./pdf-index.local.js" defer></script>
  <script src="./resume.js" defer></script>
</head>
<body id="top">
  <a class="skip-link" href="#intro">跳到个人介绍</a>
  <main class="site-width layout">
    <aside class="sidebar" aria-label="个人资料">
      <div class="side-card">
        <div class="portrait" id="portrait">
          <span class="portrait-placeholder"><i aria-hidden="true"></i>个人照片</span>
        </div>
        <div class="identity">
          <p class="profile-name" id="profile-name"></p>
          <p class="profile-role" id="profile-role"></p>
        </div>
        <section class="side-section" id="education-section" aria-labelledby="education-heading" hidden>
          <h2 id="education-heading">教育背景</h2>
          <div class="education">
            <p class="education-school" id="education-school"></p>
            <p id="education-program"></p>
            <p class="education-period" id="education-period"></p>
          </div>
        </section>
        <section class="side-section" id="skills-section" aria-labelledby="skills-heading">
          <h2 id="skills-heading">个人技能</h2>
          <ul class="skills" id="skills"></ul>
        </section>
        <section class="side-section" id="contact-section" aria-labelledby="contact-heading">
          <h2 id="contact-heading">联系方式</h2>
          <dl class="contacts" id="contacts"></dl>
        </section>
        <a class="download" id="download" href="./assets/吴永强个人简历.pdf" download="吴永强个人简历.pdf">
          <span class="download-icon" aria-hidden="true"></span>
          <span>下载个人简历</span><span class="file-type">PDF</span>
        </a>
      </div>
    </aside>

    <section class="intro" id="intro" aria-labelledby="intro-title">
      <div class="hero-art" aria-hidden="true"></div>
      <div class="intro-content">
        <p class="intro-label">个人介绍</p>
        <h1 id="intro-title">你好，我是<span class="intro-name" id="intro-name"></span></h1>
        <p class="bio" id="bio"></p>
      </div>
    </section>

    <div class="collections" aria-label="作品与文档">
      <section class="collection" id="analysis" aria-labelledby="analysis-title">
        <header class="collection-header">
          <span class="collection-icon analysis-icon" aria-hidden="true"></span>
          <h2 id="analysis-title">若有所思</h2>
        </header>
        <ul class="documents" id="analysis-documents" aria-labelledby="analysis-title"></ul>
      </section>
      <section class="collection portfolio" id="portfolio" aria-labelledby="portfolio-title">
        <header class="collection-header">
          <span class="collection-icon portfolio-icon" aria-hidden="true"></span>
          <h2 id="portfolio-title">个人作品</h2>
        </header>
        <ul class="documents" id="portfolio-documents" aria-labelledby="portfolio-title"></ul>
      </section>
    </div>

    <noscript>请启用 JavaScript，以查看个人资料和 PDF 列表。</noscript>
  </main>

  <footer class="site-width footer">
    <span id="footer-name">个人简历</span>
    <a href="#">回到顶部</a>
  </footer>
</body>
</html>
